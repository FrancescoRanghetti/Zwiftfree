<mat-toolbar class="topbar">
  @if (isHandset()) {
    <button mat-icon-button (click)="drawer.toggle()" [attr.aria-label]="'nav.openMenu' | t">
      <mat-icon fontSet="material-symbols-outlined">menu</mat-icon>
    </button>
  }
  <a routerLink="/home" class="brand">
    <img src="logo.svg" alt="" width="32" height="32" />
    <span>{{ 'app.name' | t }}</span>
  </a>
  <span class="spacer"></span>
  <app-device-indicator icon="pedal_bike" labelKey="devices.trainer" [status]="devices.trainer()" />
  <app-device-indicator
    icon="favorite"
    labelKey="devices.heartRate"
    [status]="devices.heartRate()"
  />
  <button mat-button class="user" [matMenuTriggerFor]="userMenu" data-testid="user-menu">
    <mat-icon fontSet="material-symbols-outlined">account_circle</mat-icon>
    <span class="user-name" data-testid="user-name">{{
      auth.me()?.displayName ?? ('user.guest' | t)
    }}</span>
  </button>
  <mat-menu #userMenu="matMenu" xPosition="before">
    <a mat-menu-item routerLink="/account">
      <mat-icon fontSet="material-symbols-outlined">person</mat-icon>{{ 'nav.account' | t }}
    </a>
    <a mat-menu-item routerLink="/settings">
      <mat-icon fontSet="material-symbols-outlined">settings</mat-icon>{{ 'nav.settings' | t }}
    </a>
    <button mat-menu-item (click)="auth.logout()" data-testid="logout">
      <mat-icon fontSet="material-symbols-outlined">logout</mat-icon>{{ 'user.logout' | t }}
    </button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav
    #drawer
    class="sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
  >
    <nav class="nav" [attr.aria-label]="'nav.openMenu' | t">
      @for (item of navItems; track item.path) {
        <a
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          (click)="isHandset() && drawer.close()"
        >
          <mat-icon fontSet="material-symbols-outlined">{{ item.icon }}</mat-icon>
          <span>{{ item.labelKey | t }}</span>
        </a>
      }
    </nav>
  </mat-sidenav>
  <mat-sidenav-content class="content">
    <main>
      <router-outlet />
    </main>
    <footer class="attribution">{{ 'footer.attribution' | t }}</footer>
  </mat-sidenav-content>
</mat-sidenav-container>
