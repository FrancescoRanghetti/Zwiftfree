map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 20m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/vnd.mapbox-vector-tile;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location ~ ^/(swagger-ui|v3/api-docs) {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
  }

  # MapLibre's module worker: nginx's mime.types has no .mjs entry.
  location ~ \.mjs$ {
    default_type application/javascript;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Hashed bundles: cache forever.
  location ~* \.(?:js|css|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
