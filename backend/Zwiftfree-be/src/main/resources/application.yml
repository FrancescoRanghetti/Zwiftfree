spring:
  application:
    name: zwiftfree
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/zwiftfree}
    username: ${DB_USER:zwiftfree}
    #password: ${DB_PASSWORD:zwiftfree}
    password: 'zwiftfree'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      # Jackson 3 defaults to true: a missing optional boolean (e.g. "loop") would be a 400.
      fail-on-null-for-primitives: false
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8090}
  forward-headers-strategy: framework
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

zwiftfree:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4280}
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    max-failed-logins-per-email: 5
    max-failed-logins-per-ip: 20
    login-window: 15m
  roads:
    data-dir: ${ROAD_DATA_DIR:../../data/out}
    import-enabled: ${ROAD_IMPORT:true}
    tile-cache-size: 4000
